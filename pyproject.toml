[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radwan-text-expander"
version = "1.0.0"
description = "Local, dependency-free text snippet expander with templates and persistent storage."
requires-python = ">=3.10"
authors = [{name = "Radwan Abdulhadi Ahmed"}]
license = {text = "MIT"}
keywords = ["text-expander", "snippets", "productivity", "cli"]

[project.scripts]
text-expander = "text_expander.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
